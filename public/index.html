<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10151b">
<title>Ballpark Bingo</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 14px 12px calc(28px + env(safe-area-inset-bottom));
    font: 16px/1.4 -apple-system, system-ui, sans-serif;
    background: #10151b; color: #e8edf2;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 18px; margin: 0 0 10px; letter-spacing: .01em; }

  .bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
         font-size: 11px; color: #9fb0c0; margin-bottom: 12px; }
  .pill { background: #1b232c; border-radius: 999px; padding: 4px 9px; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .live .dot { background: #35c56a; } .live { color: #35c56a; }
  .down .dot { background: #e2584d; } .down { color: #e2584d; }
  .syncing .dot { background: #dcc26a; } .syncing { color: #dcc26a; }

  input, button { font: inherit; border-radius: 10px; border: 1px solid #2b3742; }
  input { background: #171f27; color: #e8edf2; padding: 13px; width: 100%; }
  #go { background: #2f6fd0; color: #fff; border-color: #2f6fd0;
        padding: 14px; width: 100%; margin-top: 10px; font-weight: 600; }

  /* Phase banner. Silent during OPEN so the grid gets the whole screen. */
  #banner { border-radius: 12px; padding: 16px 14px; margin-bottom: 13px; text-align: center; }
  #banner.idle { background: #1b232c; color: #9fb0c0; }
  #banner.resolved { background: #3a2418; border: 1px solid #f0a35e; color: #ffd9b0; }
  #banner.resolved.mine { background: #1d4430; border-color: #4fe08a; color: #d8ffe8; }
  .bt { font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .bs { font-size: 13px; margin-top: 6px; opacity: .85; }

  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 16px; }
  #grid.locked { pointer-events: none; }
  #grid.dim { opacity: .5; }
  .sq {
    position: relative; aspect-ratio: 1; border-radius: 8px;
    background: #1b232c; border: 1px solid #263039; color: #cdd9e4;
    padding: 3px; line-height: 1.1; text-align: center; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation; cursor: pointer; font-family: inherit;
    transition: background .12s, border-color .12s;
  }
  .sq:active { transform: scale(.96); }
  .sq .t { position: relative; z-index: 1; }
  .sq.on { background: #1d4430; border-color: #35c56a; color: #ffffff; font-weight: 600; }
  .sq.on::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .45; z-index: 0;
    background:
      linear-gradient(to top left, transparent 46.5%, #4fe08a 46.5%, #4fe08a 53.5%, transparent 53.5%),
      linear-gradient(to top right, transparent 46.5%, #4fe08a 46.5%, #4fe08a 53.5%, transparent 53.5%);
  }
  .sq.pending { border-style: dashed; border-color: #dcc26a; }
  .sq.win { border-color: #ffd166; box-shadow: 0 0 0 2px #ffd166; }
  .sq.free { background: #243447; color: #7fb0ea; font-weight: 700; font-size: 11px; cursor: default; }
  .sq.reverted { animation: revert .7s ease; }
  @keyframes revert {
    0%, 100% { box-shadow: none; }
    25%, 75% { box-shadow: inset 0 0 0 3px #e2584d; }
  }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
       color: #7c8b9a; margin: 16px 0 7px; font-weight: 600; }
  .row { display: flex; justify-content: space-between; align-items: center;
         padding: 9px 11px; background: #171f27; border-radius: 8px; margin-bottom: 4px; font-size: 14px; }
  .wins { font-size: 11px; color: #7c8b9a; margin-left: 6px; }
  .badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 3px 8px; border-radius: 999px; }
  .COLD { background: #23313d; color: #8fa6ba; }
  .WARM { background: #3b3620; color: #dcc26a; }
  .HOT { background: #46301d; color: #f0a35e; }
  .BLAZING { background: #4d2020; color: #ff7a6b; }
  #controls { margin-top: 18px; }
  .ctrl { width: 100%; padding: 15px; font-weight: 600; margin-bottom: 8px;
          border-radius: 10px; touch-action: manipulation; font-family: inherit; }
  .ctrl.primary { background: #2f6fd0; border-color: #2f6fd0; color: #fff; }
  .ctrl.danger { background: #241a1a; border-color: #4d302e; color: #d08b84; }
  .ctrl.danger.armed { background: #8f2b22; border-color: #e2584d; color: #fff; }
  .ctrl:disabled { opacity: .3; }
  .hide { display: none; }
  .note { font-size: 11px; color: #62727f; margin-top: 18px; line-height: 1.5; }
  code { font-size: 11px; color: #8fa6ba; }
</style>
</head>
<body>

<h1>Ballpark Bingo</h1>

<div id="join">
  <input id="name" placeholder="Your name" maxlength="20" autocomplete="off" autocapitalize="words">
  <button id="go">Join</button>
</div>

<div id="game" class="hide">
  <div class="bar">
    <span id="conn" class="pill live"><span class="dot"></span>live</span>
    <span class="pill">inning <span id="round">0</span></span>
    <span class="pill" id="phase">IDLE</span>
    <span class="pill hide" id="queue"></span>
  </div>

  <div id="banner" class="hide"></div>
  <div id="grid"></div>

  <h2>Players</h2>
  <div id="players"></div>

  <h2>Round control</h2>
  <div id="controls">
    <button id="nextInning" class="ctrl primary"></button>
    <button id="forceResolve" class="ctrl danger">Force Resolve</button>
    <div class="note" id="ctrlNote"></div>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

// --- client state ----------------------------------------------------------
// `serverMarks` is the truth. `pending` is what this phone believes it just
// did but the server has not confirmed. What you see is server + pending
// laid on top; when the server disagrees, the overlay is dropped and the
// square visibly snaps back.
let playerId = localStorage.getItem('bb.playerId');
let snap = null;
let serverMarks = [];
const pending = new Map(); // cardIndex -> { value, seq, sending }
let seq = 0;
let lastVersion = -1;
let lastRound = null;
let cells = null;
let polling = false;

function effectiveMarks() {
  const m = serverMarks.slice();
  for (const [i, p] of pending) m[i] = p.value;
  return m;
}

const isOpen = () => snap && snap.phase === 'OPEN';

// --- joining ---------------------------------------------------------------
async function join() {
  const name = $('name').value.trim();
  if (!name) return;
  $('go').disabled = true;
  try {
    const r = await fetch('/join', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'join failed');
    playerId = data.playerId;
    localStorage.setItem('bb.playerId', playerId);
    start(data.snapshot);
  } catch (e) {
    alert(e.message);
    $('go').disabled = false;
  }
}

function start(first) {
  $('join').classList.add('hide');
  $('game').classList.remove('hide');
  buildGrid();
  applySnapshot(first);
  if (!polling) { polling = true; setInterval(poll, 3000); }
}

function handleGone() {
  localStorage.removeItem('bb.playerId');
  location.reload();
}

// --- grid ------------------------------------------------------------------
function fontFor(text) {
  if (text.length <= 14) return '11px';
  if (text.length <= 24) return '10px';
  if (text.length <= 40) return '9px';
  return '8px';
}

function buildGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  cells = new Array(24);
  for (let cell = 0; cell < 25; cell++) {
    const el = document.createElement('button');
    if (cell === 12) {
      el.className = 'sq free';
      el.textContent = 'FREE';
      el.disabled = true;
      grid.appendChild(el);
      continue;
    }
    const index = cell < 12 ? cell : cell - 1;
    el.className = 'sq';
    const label = document.createElement('span');
    label.className = 't';
    el.appendChild(label);
    el.addEventListener('click', () => tap(index));
    grid.appendChild(el);
    el._label = label;
    cells[index] = el;
  }
}

// --- optimistic marking ----------------------------------------------------
function tap(index) {
  if (!isOpen()) return; // the server refuses too; this just avoids the round trip
  const next = !effectiveMarks()[index];
  pending.set(index, { value: next, seq: ++seq, sending: false });
  paint();            // immediate, before the network knows anything
  sendMark(index);
}

async function sendMark(index) {
  const p = pending.get(index);
  if (!p || p.sending) return;
  p.sending = true;

  try {
    const r = await fetch('/mark', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ playerId, index, value: p.value, round: snap.round }),
    });
    if (r.status === 404) return handleGone();

    const body = await r.json();
    const before = effectiveMarks();

    // Whether the server agreed or refused, this attempt is resolved: drop the
    // optimistic value and let the authoritative state show through.
    if (pending.get(index) === p) pending.delete(index);

    if (r.ok) applySnapshot(body, before);
    else { paint(); flashIfChanged(before); }

    // The fetch succeeded, so we are online. Say so now rather than letting the
    // pill read "syncing" until the next poll three seconds from now.
    if (!pending.size) setConn('live');
  } catch {
    // Network died. Keep the optimistic value and re-send on the next poll,
    // so a dead spot in the stands doesn't silently eat a mark.
    p.sending = false;
    setConn('down');
  }
}

function retryPending() {
  for (const [index, p] of pending) if (!p.sending) sendMark(index);
}

// --- polling ---------------------------------------------------------------
async function poll() {
  try {
    const r = await fetch(`/state/${playerId}?since=${lastVersion}`);
    if (r.status === 404) return handleGone();
    const data = await r.json();
    if (data.changed !== false) applySnapshot(data);
    setConn(pending.size ? 'syncing' : 'live');
    retryPending();
  } catch {
    setConn('down');
  }
}

// --- rendering -------------------------------------------------------------
function applySnapshot(next, beforeDisplay) {
  // A rollover invalidates anything this phone still had in flight — those
  // taps were aimed at a card that no longer exists. Dropping them here is the
  // client half; the server half is the stale-round guard in /mark.
  if (lastRound !== null && next.round !== lastRound) pending.clear();
  lastRound = next.round;

  const before = beforeDisplay || (snap ? effectiveMarks() : null);
  snap = next;
  serverMarks = next.marks;
  lastVersion = next.version;
  paint();
  if (before) flashIfChanged(before);
}

function flashIfChanged(before) {
  const after = effectiveMarks();
  for (let i = 0; i < after.length; i++) {
    if (before[i] !== after[i] && cells[i]) {
      cells[i].classList.remove('reverted');
      void cells[i].offsetWidth; // restart the animation
      cells[i].classList.add('reverted');
    }
  }
}

function paint() {
  if (!snap || !cells) return;
  $('round').textContent = snap.round;
  $('phase').textContent = snap.phase;

  const open = isOpen();
  $('grid').classList.toggle('locked', !open);
  $('grid').classList.toggle('dim', snap.phase === 'IDLE');
  renderBanner();
  renderControls();

  const marks = effectiveMarks();
  const winLine = snap.winner && snap.winner.isYou ? snap.winner.line : null;

  for (let i = 0; i < 24; i++) {
    const el = cells[i];
    const text = snap.card[i].text;
    if (el.dataset.text !== text) {
      el._label.textContent = text;
      el.dataset.text = text;
      el.style.fontSize = fontFor(text);
    }
    el.classList.toggle('on', !!marks[i]);
    el.classList.toggle('pending', pending.has(i));
    el.classList.toggle('win', !!winLine && winLine.includes(i));
  }

  const q = $('queue');
  if (pending.size) {
    q.textContent = pending.size + ' unsent';
    q.classList.remove('hide');
  } else {
    q.classList.add('hide');
  }

  $('players').innerHTML = snap.players.map((p) =>
    `<div class="row"><span>${esc(p.name)}${p.isYou ? ' (you)' : ''}` +
    `${p.roundWins ? `<span class="wins">${p.roundWins}W</span>` : ''}</span>` +
    `<span class="badge ${p.badge}">${p.badge}</span></div>`
  ).join('');
}

/**
 * The phase machine is the whole UI (§6). OPEN says nothing so the grid gets
 * the screen; RESOLVED is deliberately loud, because it is the cue to put the
 * phone down and argue about the call.
 */
function renderBanner() {
  const b = $('banner');
  const w = snap.winner;

  if (snap.phase === 'OPEN') { b.className = 'hide'; return; }

  if (snap.phase === 'IDLE') {
    b.className = 'idle';
    b.innerHTML = '<div class="bt">No inning open</div>' +
      '<div class="bs">Waiting for someone to start inning 1.</div>';
    return;
  }

  b.className = 'resolved' + (w && w.isYou ? ' mine' : '');
  if (!w) {
    b.innerHTML = `<div class="bt">Push</div>` +
      `<div class="bs">Inning ${snap.round} ended with no bingo.</div>`;
  } else if (w.isYou) {
    b.innerHTML = `<div class="bt">BINGO</div>` +
      `<div class="bs">You took inning ${snap.round}. ${snap.you.roundWins} on the day.</div>`;
  } else {
    b.innerHTML = `<div class="bt">${esc(w.name)} got bingo</div>` +
      `<div class="bs">Inning ${snap.round} is over.</div>`;
  }
}

/**
 * Anyone can roll the round — no host page, no key (§5). The state machine
 * does the protecting instead: exactly one of these two is live at any moment,
 * because Start Next Inning is illegal during OPEN and Force Resolve is
 * meaningless outside it.
 */
let armed = false;
let armTimer = null;

function arm() {
  armed = true;
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { armed = false; paint(); }, 4000);
  paint();
}

function disarm() {
  armed = false;
  clearTimeout(armTimer);
}

function renderControls() {
  const next = $('nextInning');
  const force = $('forceResolve');
  const open = isOpen();

  // The whole reason a host key is unnecessary: one mis-scroll mid-round would
  // otherwise deal everybody a fresh card with no undo.
  next.disabled = open;
  next.textContent = open
    ? `Inning ${snap.round} in progress`
    : `Start inning ${snap.round + 1}`;

  if (!open) disarm();
  force.disabled = !open;
  force.classList.toggle('armed', armed);
  force.textContent = armed ? `Tap again to end inning ${snap.round}` : 'Force Resolve';

  $('ctrlNote').textContent = open
    ? 'Force Resolve ends the inning with no winner. Anyone can press it.'
    : 'Fresh cards for everyone. Anyone can press it.';
}

$('nextInning').addEventListener('click', async () => {
  $('nextInning').disabled = true;
  try { await fetch('/next-inning', { method: 'POST' }); } catch {}
  await poll();
});

$('forceResolve').addEventListener('click', async () => {
  if (!armed) return arm();   // confirm step: this one is destructive (§5)
  disarm();
  try { await fetch('/force-resolve', { method: 'POST' }); } catch {}
  await poll();
});

function setConn(kind) {
  const el = $('conn');
  el.className = 'pill ' + kind;
  el.innerHTML = '<span class="dot"></span>' +
    (kind === 'live' ? 'live' : kind === 'syncing' ? 'syncing' : 'offline');
}

function esc(s) {
  return s.replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// --- boot ------------------------------------------------------------------
$('go').addEventListener('click', join);
$('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') join(); });

if (playerId) {
  fetch(`/state/${playerId}?since=-1`)
    .then((r) => (r.ok ? r.json().then(start) : localStorage.removeItem('bb.playerId')))
    .catch(() => {});
}
</script>
</body>
</html>
